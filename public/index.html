<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Skypool CPU 矿池实时监控看板 - 实时算力、矿机状态、收益与转账记录">
<title>Skypool CPU 矿池实时监控</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card-hover:#1c2129; --border:#21262d;
  --text:#e6edf3; --sub:#8b949e; --icon:#7d8590;
  --primary:#58a6ff; --primary-bg:rgba(88,166,255,.12);
  --green:#3fb950; --green-bg:rgba(63,185,80,.12);
  --red:#f85149; --red-bg:rgba(248,81,73,.12);
  --amber:#d29922; --amber-bg:rgba(210,153,34,.14);
  --header-bg:rgba(13,17,23,.86);
  --input-bg:#0d1117; --btn-bg:#21262d; --placeholder:#6e7681;
  --row-hover:#1a2029; --row-line:#1b2129;
  --grid-line:#1c2129; --axis-line:#30363d;
  --tooltip-bg:#1c2129; --tooltip-border:#30363d;
  --pointer:#8b949e; --flash:rgba(88,166,255,.14);
  --primary-a:rgba(88,166,255,.26); --primary-a0:rgba(88,166,255,.02);
  --green-a:rgba(63,185,80,.22);   --green-a0:rgba(63,185,80,.02);
  --vol-bar:rgba(139,148,158,.4);
  --radius:10px;
}
/* 浅色主题：跟随系统设置自动切换 */
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f8fa; --card:#ffffff; --card-hover:#f0f3f6; --border:#d8dee4;
    --text:#1f2328; --sub:#656d76; --icon:#6e7781;
    --primary:#0969da; --primary-bg:rgba(9,105,218,.1);
    --green:#1a7f37; --green-bg:rgba(26,127,55,.1);
    --red:#cf222e; --red-bg:rgba(207,34,46,.08);
    --amber:#9a6700; --amber-bg:rgba(154,103,0,.1);
    --header-bg:rgba(246,248,250,.88);
    --input-bg:#ffffff; --btn-bg:#f3f4f6; --placeholder:#8c959f;
    --row-hover:#f3f6fa; --row-line:#eef1f5;
    --grid-line:#eef1f5; --axis-line:#d8dee4;
    --tooltip-bg:#ffffff; --tooltip-border:#d8dee4;
    --pointer:#656d76; --flash:rgba(9,105,218,.12);
    --primary-a:rgba(9,105,218,.2);  --primary-a0:rgba(9,105,218,.02);
    --green-a:rgba(26,127,55,.18);   --green-a0:rgba(26,127,55,.02);
    --vol-bar:rgba(101,109,118,.35);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:14px 16px 40px}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== 顶栏 ===== */
header{background:var(--header-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.hd{max-width:1200px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:.4px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px rgba(88,166,255,.75)}
.logo small{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
.hd .spacer{flex:1}
.addr-box{display:flex;align-items:center;gap:6px;flex:1 1 320px;max-width:640px}
.addr-box input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--input-bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.addr-box input::placeholder{color:var(--placeholder)}
.addr-box input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(88,166,255,.15)}
.btn{padding:8px 14px;border:1px solid var(--border);background:var(--btn-bg);border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#0d1117;font-weight:600}
.btn.primary:hover{background:#79b8ff;color:#0d1117}
.btn:disabled{opacity:.5;cursor:not-allowed}
select.btn{padding:7px 8px;background:var(--btn-bg);color:var(--text)}
#autoTag{font-size:12px;color:var(--sub);white-space:nowrap}
#clock{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

/* ===== 公告 / 错误条 ===== */
.announce{max-width:1200px;margin:12px auto 0;padding:10px 14px;background:var(--amber-bg);border:1px solid rgba(210,153,34,.35);border-radius:var(--radius);font-size:13px;color:var(--amber);display:flex;gap:8px;align-items:flex-start}
.announce b{white-space:nowrap}
.announce .x{margin-left:auto;background:none;border:none;color:var(--amber);cursor:pointer;font-size:15px;line-height:1}
.hidden{display:none!important}
.errbar{max-width:1200px;margin:12px auto 0;padding:10px 14px;background:var(--red-bg);border:1px solid rgba(248,81,73,.35);border-radius:var(--radius);font-size:13px;color:var(--red)}
.errbar b{margin-right:6px}

/* ===== 指标卡（Moneroocean 式：图标 + 大数字 + 小标签） ===== */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;position:relative}
.card .ico{display:block;color:var(--icon);margin-bottom:12px;opacity:.9}
.card .val{font-size:24px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.25}
.card .val small{font-size:13px;font-weight:400;color:var(--sub);margin-left:4px}
.card .lb{font-size:12px;color:var(--sub);margin-top:9px;display:flex;align-items:center;gap:6px}
.card .sub{font-size:11px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums;opacity:.8}
.onv{color:var(--green)}
.offv{color:var(--sub);font-size:16px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge.on{background:var(--green-bg);color:var(--green)}
.badge.off{background:var(--red-bg);color:var(--red)}
.badge.warn{background:var(--amber-bg);color:var(--amber)}
.up{color:var(--green)} .down{color:var(--red)}

/* ===== Panel ===== */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-top:12px;padding:16px}
.panel h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h2 .hl{width:3px;height:14px;border-radius:2px;background:var(--primary)}
.panel .p-sub{font-size:12px;color:var(--sub);margin-left:auto;font-weight:400}
#chart{width:100%;height:340px;margin-top:10px}
#priceChart{width:100%;height:300px;margin-top:10px}

/* 行情 */
.mkt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 28px;margin-top:4px}
.mkt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--row-line);font-size:13px}
.mkt .k{color:var(--sub);font-size:12px}
.mkt .v{font-weight:600;font-variant-numeric:tabular-nums}

/* ===== Tabs & Table ===== */
.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tab{padding:6px 13px;border:1px solid transparent;border-radius:8px;font-size:12px;background:transparent;color:var(--sub);cursor:pointer;transition:all .18s;font-family:inherit}
.tab:hover{color:var(--text);background:var(--card-hover)}
.tab.active{background:var(--primary-bg);color:var(--primary);border-color:rgba(88,166,255,.35);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--green);animation:breath 2.2s ease-in-out infinite}
.tab.offtab .dot{background:var(--placeholder);animation:none}
.table-wrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{background:transparent;text-align:left;padding:9px 14px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px}
td{padding:11px 14px;border-bottom:1px solid var(--row-line);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--row-hover)}
td .offline-mark{color:var(--red)}
.empty{padding:30px;text-align:center;color:var(--sub);font-size:13px}

/* ===== 动效 ===== */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breath{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.78)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flashBg{0%{background-color:rgba(88,166,255,0)}35%{background-color:var(--flash)}100%{background-color:rgba(88,166,255,0)}}
.cards .card{animation:riseIn .5s cubic-bezier(.22,.61,.36,1) both}
.cards .card:nth-child(2){animation-delay:.05s}
.cards .card:nth-child(3){animation-delay:.10s}
.cards .card:nth-child(4){animation-delay:.15s}
.cards .card:nth-child(5){animation-delay:.20s}
.cards .card:nth-child(6){animation-delay:.25s}
.cards .card:nth-child(7){animation-delay:.30s}
.cards .card:nth-child(8){animation-delay:.35s}
.panel{animation:riseIn .45s cubic-bezier(.22,.61,.36,1) .15s both}
.card{transition:transform .22s ease,border-color .22s ease,background .22s ease}
.card:hover{transform:translateY(-2px);border-color:#30363d;background:var(--card-hover)}
.card .val{transition:background-color .3s}
.val.flash{animation:flashBg .9s ease}
.btn{transition:border-color .15s,color .15s,background .15s}
.btn .ico{display:inline-block;vertical-align:-2px;margin-right:5px}
.btn.spin .ico{animation:spin .85s linear infinite}
#workerTbody{transition:opacity .16s}
#workerTbody.switching{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* demo 标签（主题跟随） */
#demoTag{font-size:11px;color:var(--amber);background:var(--amber-bg);padding:1px 8px;border-radius:10px;font-weight:600}

/* ===== K 线入口 & K 线页 ===== */
.kline-entry{max-width:1200px;margin:12px auto 0;display:flex;justify-content:center}
.kline-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border:1px solid rgba(88,166,255,.4);background:rgba(88,166,255,.08);color:var(--primary);border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.kline-btn:hover{background:rgba(88,166,255,.16);transform:translateY(-1px)}
.kline-btn .arr{transition:transform .2s}
.kline-btn:hover .arr{transform:translateX(3px)}
#viewKline{max-width:1200px;margin:0 auto;padding:14px 16px 40px}
.kline-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.kline-title{font-size:17px;font-weight:700}
.kline-info{font-size:12px;color:var(--sub);margin-left:auto}
.coin-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ctab{padding:6px 14px;border:1px solid var(--border);background:var(--card);border-radius:8px;font-size:12px;color:var(--sub);cursor:pointer;transition:all .18s;font-family:inherit}
.ctab:hover{color:var(--text);border-color:var(--primary)}
.ctab.active{background:var(--primary-bg);color:var(--primary);border-color:rgba(88,166,255,.35);font-weight:600}
#klineChart{width:100%;height:430px;margin-top:10px}

/* ===== 响应式：电脑 / 平板 / 手机 ===== */
footer{max-width:1200px;margin:22px auto 0;padding:0 16px;font-size:12px;color:var(--sub);text-align:center;opacity:.75}
@media (max-width:1024px){
  .cards{grid-template-columns:repeat(3,1fr)}
  .mkt-grid{grid-template-columns:repeat(2,1fr)}
  #chart{height:320px}
}
@media (max-width:768px){
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .addr-box{flex-basis:100%;max-width:none}
  .hd{gap:8px}
  #chart{height:290px}
  #priceChart{height:250px}
  #klineChart{height:380px}
  .kline-info{margin-left:0;width:100%}
}
@media (max-width:480px){
  .card{padding:12px}
  .card .val{font-size:20px}
  .card .ico{margin-bottom:9px}
  .offv{font-size:14px}
  .range-btns{margin-right:0}
  .panel{padding:13px}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="logo"><span class="dot"></span>SKYPOOL<span class="hidden" id="demoTag"></span><small>CPU 矿池实时监控</small></div>
    <div class="spacer"></div>
    <span id="clock"></span>
  </div>
  <div class="hd" style="padding-top:0">
    <div class="addr-box">
      <input id="addr" type="text" spellcheck="false" placeholder="输入 XMR 钱包地址，例如 44nJWEi...">
      <button class="btn primary" id="btnLoad">查询</button>
      <button class="btn" id="btnRefresh" title="手动刷新"><svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>刷新</button>
    </div>
    <select class="btn" id="autoSel" title="自动刷新间隔">
      <option value="0">自动刷新:关</option>
      <option value="30000">30 秒</option>
      <option value="60000" selected>60 秒</option>
      <option value="120000">2 分钟</option>
      <option value="300000">5 分钟</option>
    </select>
    <span id="autoTag"></span>
  </div>
</header>

<div class="wrap" id="viewDash">
  <div class="announce hidden" id="announce"><b>公告</b><span id="announceTxt"></span><button class="x" id="announceClose">×</button></div>
  <div class="errbar hidden" id="errbar"><b>连接失败</b><span id="errTxt"></span></div>

  <section class="cards" id="cards">
    <div class="card">
      <svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      <div class="val" id="cHash">—</div>
      <div class="lb">当前算力</div><div class="sub" id="cHashSub">最近一次提交</div>
    </div>
    <div class="card">
      <svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div class="val" id="h24">—</div>
      <div class="lb">24 小时算力</div><div class="sub" id="h24Sub">曲线平均</div>
    </div>
    <div class="card">
      <svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>
      <div class="val" id="cReward">—</div>
      <div class="lb">预估日收益</div><div class="sub" id="cRewardSub"></div>
    </div>
    <div class="card">
      <svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      <div class="val" style="font-size:19px;line-height:1.5"><span class="onv" id="onCnt">0 在线</span>&ensp;<span class="offv" id="offCnt">0 离线</span></div>
      <div class="lb">矿机在线 / 离线</div><div class="sub">矿工在线统计</div>
    </div>
    <div class="card">
      <svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>
      <div class="val" id="cBalance">—</div>
      <div class="lb">钱包余额</div><div class="sub" id="cBalanceSub"></div>
    </div>
    <div class="card">
      <svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3 21 7l-4 4"/><path d="M21 7H9a4 4 0 0 0-4 4v0"/><path d="M7 21 3 17l4-4"/><path d="M3 17h12a4 4 0 0 0 4-4v0"/></svg>
      <div class="val" id="cPaid">—</div>
      <div class="lb">已转账</div><div class="sub">累计支付</div>
    </div>
    <div class="card">
      <svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v18M15 3v18"/><path d="M4 9h16M4 15h16"/></svg>
      <div class="val" id="cTotal">—</div>
      <div class="lb">挖矿总哈希</div><div class="sub" id="cTotalSub"></div>
    </div>
    <div class="card">
      <svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
      <div class="val" id="cPrice">—</div>
      <div class="lb">XMR 价格</div><div class="sub" id="cPriceSub"></div>
    </div>
  </section>

  <section class="panel">
    <h2><span class="hl"></span>算力 / 时间
      <span class="p-sub" id="chartSub"></span>
    </h2>
    <div id="chart"></div>
  </section>

  <section class="panel">
    <h2><span class="hl"></span>门罗币价格 / 24 小时<span class="p-sub" id="priceChartSub"></span></h2>
    <div id="priceChart"></div>
  </section>

  <div class="kline-entry">
    <button class="kline-btn" id="btnKline">查看各大币种 30 天 K 线<span class="arr">→</span></button>
  </div>

  <section class="panel">
    <h2><span class="hl"></span>行情与矿池</h2>
    <div class="mkt-grid">
      <div class="mkt"><span class="k">XMR 单价</span><span class="v" id="mPrice">—</span></div>
      <div class="mkt"><span class="k">24h 涨跌幅</span><span class="v" id="mChg">—</span></div>
      <div class="mkt"><span class="k">XMR 日收益 / H/s</span><span class="v" id="mReward">—</span></div>
      <div class="mkt"><span class="k">每日收益估算</span><span class="v" id="mRewardCny">—</span></div>
      <div class="mkt"><span class="k">矿池算力</span><span class="v" id="mPoolHash">—</span></div>
      <div class="mkt"><span class="k">全网算力</span><span class="v" id="mNetHash">—</span></div>
      <div class="mkt"><span class="k">池内矿工</span><span class="v" id="mMiners">—</span></div>
      <div class="mkt"><span class="k">当前区块高度</span><span class="v" id="mHeight">—</span></div>
    </div>
  </section>

  <section class="panel">
    <h2><span class="hl"></span>矿机明细<span class="p-sub" id="workerSub"></span></h2>
    <div class="tabs">
      <button class="tab active" data-t="online"><span class="dot"></span>在线 (<span id="tabOn">0</span>)</button>
      <button class="tab offtab" data-t="offline"><span class="dot"></span>离线 (<span id="tabOff">0</span>)</button>
      <button class="tab" data-t="pay">转账记录 (<span id="tabPay">0</span>)</button>
    </div>
    <div class="table-wrap"><table id="workerTable"><tbody id="workerTbody"></tbody></table></div>
  </section>
</div>

<!-- ===== 视图：各币种 30 天 K 线 ===== -->
<div id="viewKline" class="hidden">
  <div class="kline-top">
    <button class="btn" id="btnBack">← 返回</button>
    <span class="kline-title">虚拟货币 30 天 K 线</span>
    <span class="kline-info" id="klineInfo"></span>
  </div>
  <div class="coin-tabs" id="coinTabs"></div>
  <section class="panel">
    <h2><span class="hl"></span><span id="klineName">—</span> / USDT · 30 天日 K<span class="p-sub" id="klineSub"></span></h2>
    <div id="klineChart"></div>
  </section>
</div>

<footer>数据来源：Skypool 公共接口（api.skypool.xyz）</footer>

<script>
"use strict";
/* ============================================================
   Skypool CPU 矿池实时监控
   接口（均来自官网前端实际调用，CORS 已放行 *）：

/* ---------- 工具函数 ---------- */
function fmtHash(h){
  h = Number(h) || 0;
  if(h < 1000) return h.toFixed(0) + " H/s";
  if(h < 1e6) return (h/1e3).toFixed(2) + " KH/s";
  if(h < 1e9) return (h/1e6).toFixed(2) + " MH/s";
  if(h < 1e12) return (h/1e9).toFixed(2) + " GH/s";
  return (h/1e12).toFixed(2) + " TH/s";
}
function fmtCount(n){
  n = Number(n) || 0;
  if(n < 1e3) return n.toFixed(0);
  if(n < 1e6) return (n/1e3).toFixed(2) + "K";
  if(n < 1e9) return (n/1e6).toFixed(2) + "M";
  return (n/1e9).toFixed(2) + "G";
}
function fmtXmr(n){ return (Number(n)||0).toFixed(6); }
function fmtYuan(n){
  n = Number(n)||0;
  return n < 1 ? "¥" + n.toFixed(3) : "¥" + n.toFixed(2);
}
/* 数字滚动：将元素文本从旧值动画到新值，保留单位/符号；
   无法对应或大数直接切换（避免背景步子或数量级变化时乱飞） */
function animateText(el, txt){
  if(!el || el.textContent === txt) return;
  var re = /-?\d+(?:\.\d+)?/g;
  var o = (el.textContent.match(re) || []).map(Number);
  var n = (txt.match(re) || []).map(Number);
  var big = n.some(function(v){ return Math.abs(v) > 1e7; });
  /* 单位切换防护：旧新值比值超 2 倍直接切换，避免中途显示错误中间值 */
  var ratioOk = true;
  for(var j=0;j<n.length;j++){
    var a = Math.abs(o[j]||0), b = Math.abs(n[j]||0);
    if(a > 0 && b > 0 && Math.max(a,b)/Math.min(a,b) > 2){ ratioOk = false; break; }
  }
  if(!o.length || o.length !== n.length || big || !ratioOk){ el.textContent = txt; return; }
  var t0 = null, dur = 480, i;
  function step(ts){
    if(!t0) t0 = ts;
    var p = Math.min((ts - t0) / dur, 1);
    var e = 1 - Math.pow(1 - p, 3);
    i = 0;
    el.textContent = txt.replace(re, function(m){
      var v = o[i] + (n[i] - o[i]) * e;
      var dec = (m.indexOf('.') >= 0) ? (m.length - m.indexOf('.') - 1) : 0;
      i++;
      return v.toFixed(dec);
    });
    if(p < 1) requestAnimationFrame(step); else el.textContent = txt;
  }
  requestAnimationFrame(step);
}
/* 数据更新高亮：赋值后让元素背景微微闪一下 */
function flash(el){
  if(!el) return;
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}
function setVal(el, txt){
  if(!el) return;
  animateText(el, txt);
  if(el.textContent !== txt) flash(el);
}

function themeVars(){

  function g(n){ return cs.getPropertyValue(n).trim(); }
  return {
    primary: g("--primary"), green: g("--green"), red: g("--red"), amber: g("--amber"),
    text: g("--text"), sub: g("--sub"), placeholder: g("--placeholder"),
    gridLine: g("--grid-line"), axisLine: g("--axis-line"),
    tooltipBg: g("--tooltip-bg"), tooltipBorder: g("--tooltip-border"),
    pointer: g("--pointer"), primaryBg: g("--primary-bg"),
    primaryA: g("--primary-a"), primaryA0: g("--primary-a0"),
    greenA: g("--green-a"), greenA0: g("--green-a0"),
    volBar: g("--vol-bar")
  };
}
function relTime(sec){
  sec = Number(sec)||0;
  if(sec < 60) return Math.max(sec,0).toFixed(0) + " 秒前";
  if(sec < 3600) return (sec/60).toFixed(0) + " 分钟前";
  if(sec < 86400) return (sec/3600).toFixed(1) + " 小时前";
  return (sec/86400).toFixed(1) + " 天前";
}
function pad(n){ return (n<10?"0":"")+n; }
function fmtDate(tsMs){
  var d = new Date(tsMs);
  return pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function jget(url, timeout){
  timeout = timeout || 12000;
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort(); }, timeout);
  return fetch(url, { method:"GET", credentials:"omit", signal: ctrl.signal })
    .then(function(r){ clearTimeout(t); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); },
          function(e){ clearTimeout(t); throw e; });
}

/* 价格多源自动容错：依次尝试，第一个解析成功的即为最终价格。
   全部失败时 S.price=null，页面价格显示占位，不影响其他功能。
   注：mainApi 仅对 skypool 自家域名放行 CORS，第三方托管下会自动跳到后面的源。 */
function loadPrice(){
  var PRICE_URL = MAIN_API + "/v1/info/getPrice";
  var GATE_URL = "https://api.gateio.ws/api/v4/futures/usdt/tickers?contract=XMR_USDT";
  /* Gate 永续合约价(USD) × open.er-api 汇率(USD→CNY)：两者中国网络实测可达、CORS 放行。
     parse 返回 Promise：先取合约价，再取汇率换算成 CNY；汇率失败则退回显示 USD 价。 */
  var sources = [
    { name:"main", url:PRICE_URL,
      parse:function(d){ var x = d && d.data && d.data.XMR; if(x && !isNaN(Number(x.CNY))) return { cny:Number(x.CNY), chg:Number(x.CNY_CH)||0, src:"skypool" }; return null; } },
    { name:"gate", url:GATE_URL,
      parse:function(d){
        if(!d || !Array.isArray(d) || !d[0] || isNaN(Number(d[0].last))) return null;
        var usd = Number(d[0].last), chg = Number(d[0].change_percentage) || 0;
        return jget(FX_URL, 6000).then(function(r){
          var cny = r && r.rates ? Number(r.rates.CNY) : 0;
          return cny > 0 ? { cny: usd*cny, chg: chg, src:"gate" } : { usd: usd, chg: chg, src:"gate" };
        }).catch(function(){ return { usd: usd, chg: chg, src:"gate" }; });
      } },
    { name:"skypool-proxy", url:"https://corsproxy.io/?url=" + encodeURIComponent(PRICE_URL),
      parse:function(d){ var x = d && d.data && d.data.XMR; if(x && !isNaN(Number(x.CNY))) return { cny:Number(x.CNY), chg:Number(x.CNY_CH)||0, src:"skypool(代理)" }; return null; } },
    { name:"skypool-proxy2", url:"https://api.allorigins.win/raw?url=" + encodeURIComponent(PRICE_URL),
      parse:function(d){ var x = d && d.data && d.data.XMR; if(x && !isNaN(Number(x.CNY))) return { cny:Number(x.CNY), chg:Number(x.CNY_CH)||0, src:"skypool(代理)" }; return null; } },
    { name:"cryptocompare", url:"https://min-api.cryptocompare.com/data/price?fsym=XMR&tsyms=CNY,USD",
      parse:function(d){ if(d && !isNaN(Number(d.CNY))) return { cny:Number(d.CNY), src:"cryptocompare" }; if(d && !isNaN(Number(d.USD))) return { usd:Number(d.USD), src:"cryptocompare" }; return null; } },
    { name:"coinbase", url:"https://api.coinbase.com/v2/prices/XMR-USD/spot",
      parse:function(d){ if(d && d.data && !isNaN(Number(d.data.amount))) return { usd:Number(d.data.amount), src:"coinbase" }; return null; } },
    { name:"binance", url:"https://api.binance.com/api/v3/ticker/price?symbol=XMRUSDT",
      parse:function(d){ if(d && !isNaN(Number(d.price))) return { usd:Number(d.price), src:"binance" }; return null; } }
  ];
  var i = 0;
  function doneSpin(){ var b = $("btnRefresh"); if(b) b.classList.remove("spin"); }
  function next(){
    if(i >= sources.length){ S.price = null; renderAll(); doneSpin(); return; }
    var s = sources[i++];
    jget(s.url, 8000).then(function(d){
      var p = s.parse(d);
      if(p && typeof p.then === "function"){
        p.then(function(pp){ if(pp){ S.price = pp; renderAll(); doneSpin(); } else next(); }).catch(function(){ next(); });
      } else if(p){ S.price = p; renderAll(); doneSpin(); }
      else next();
    }).catch(function(){ next(); });
  }
  next();
}

/* 价格曲线：Gate 合约 K 线（USD） × 汇率 = CNY，pts 旧→新 */
function buildPriceChart(d, fx){
  if(!Array.isArray(d) || !d.length) return null;
  var pts = [];
  d.forEach(function(k){
    var c = Number(k && k.c); if(!c || isNaN(c)) return;
    pts.push({ ts: Number(k.t) * 1000, usd: c, cny: fx > 0 ? c * fx : 0 });
  });
  pts.sort(function(a,b){ return a.ts - b.ts; });
  return { pts: pts, fx: fx };
}

/* allWorkers/allOfflineWorkers 返回 {矿机名:{hash,hash2,hash1h,hash24h,lts}, global:{...}}
   跳过 global 键，转成数组 */
function listWorkers(obj){
  var out = [];
  if(!obj || typeof obj !== "object") return out;
  Object.keys(obj).forEach(function(k){
    if(k === "global" || k === "total") return;
    var w = obj[k];
    out.push({ name:k, hash: w.hash, hash2: w.hash2, hash1h: w.hash1h, hash24h: w.hash24h, lts: w.lts });
  });
  out.sort(function(a,b){ return (b.hash2||0) - (a.hash2||0); });
  return out;
}

  /* 收益自算（不依赖 mainApi）：Monero 120 秒出块、每日 720 块
     rewardPerHs = 720 * 区块奖励(XMR) / 全网算力(H/s)，全网算力 = 网络难度 / 120 */
  var rewardPerHs = 0;
  if(S.netStats){
    var diff = Number(S.netStats.difficulty) || 0;
    var val = Number(S.netStats.value) || 0;
    if(diff > 0 && val > 0) rewardPerHs = 720 * (val / 1e12) / (diff / 120);

  if(st){

  /* 价格卡 */

  $("cPriceSub").textContent = chg!=null ? ((chg>=0?"+":"") + chg.toFixed(2) + "% 24h") : (p ? "来源 " + p.src : "价格源不可用");

  /* 行情与矿池 */

  $("mChg").textContent = chg!=null ? ((chg>=0?"+":"") + chg.toFixed(2) + "%") : "—";
  $("mChg").className = "v" + (chg!=null ? (chg>=0?" up":" down") : "");
  $("mReward").textContent = rewardPerHs ? (rewardPerHs*1e8).toFixed(2) + "e-8 XMR" : "—";
  $("mRewardCny").textContent = xmrPerDay ? (cny!=null ? "≈ " + fmtYuan(xmrPerDay*cny) : (usd!=null ? "≈ $" + (xmrPerDay*usd).toFixed(3) : "—")) : "—";
  if(S.poolStats && S.poolStats.pool_statistics){

  var fv = fx ? first.cny : first.usd, lv = fx ? last.cny : last.usd;
  var chg = fv > 0 ? (lv - fv) / fv * 100 : 0;
  $("priceChartSub").textContent = "区间 " + (chg>=0?"+":"") + chg.toFixed(2) + "%" + (fx ? " · 按当前汇率换算" : "");
  var option = {

    animation: true,

        if(!params || !params.length) return "";

      } },

    }]
  };
  priceChart.setOption(option, true);
}
/* ===== 各币种 30 天 K 线（Gate 合约日 K，可缩放） ===== */
function demoKline(base){
  var d = [], p = base;
  for(var i=29;i>=0;i--){
    var o = p, c = p * (1 + (Math.sin(i*1.3)*0.02 + (((i*7)%50)-25)/1000));
    var h = Math.max(o,c)*(1+Math.abs(Math.sin(i*2))*0.015);
    var l = Math.min(o,c)*(1-Math.abs(Math.cos(i*2))*0.015);
    d.push({ t: Math.floor(Date.now()/1000) - i*86400, o: String(o), c: String(c), h: String(h), l: String(l), v: String(1200 + (i*13)%900) });
    p = c;
  }
  return d;
}
function loadKline(coin, cb){
  if(klineCache[coin]){ cb(klineCache[coin]); return; }
  if(isDemo){
    var base = { "BTC_USDT":105000, "ETH_USDT":3550, "XMR_USDT":550, "SOL_USDT":185,
                 "LTC_USDT":92, "DOGE_USDT":0.38, "XRP_USDT":2.2, "BCH_USDT":430 }[coin] || 100;
    klineCache[coin] = demoKline(base);
    cb(klineCache[coin]);
    return;
  }
  jget("https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=" + coin + "&interval=1d&limit=30", 10000)
    .then(function(d){ klineCache[coin] = Array.isArray(d) ? d : []; cb(klineCache[coin]); })
    .catch(function(){ cb(null); });
}
function renderKline(){
  var el = $("klineChart");
  if(typeof echarts === "undefined"){
    el.innerHTML = '<div class="empty">图表库加载失败（需联网访问 jsDelivr CDN）</div>';
    return;
  }
  if(!klineChart) klineChart = echarts.init(el);
  var tv = themeVars();
  var raw = klineCache[activeCoin];
  if(!raw || !raw.length){
    el.innerHTML = '<div class="empty">' + (isDemo ? "演示模式仅内置演示数据" : "K 线数据加载失败（需访问 api.gateio.ws）") + '</div>';
    return;
  }
  var cc = KLINE_COINS.filter(function(x){ return x.c === activeCoin; })[0];
  $("klineName").textContent = cc ? cc.n : activeCoin;
  var dates = [], ohlc = [], vols = [];
  raw.forEach(function(k){
    dates.push(fmtDate(Number(k.t)*1000));
    ohlc.push([Number(k.o), Number(k.c), Number(k.l), Number(k.h)]);
    vols.push(Number(k.v)||0);
  });
  var fo = Number(raw[0].o), lc = Number(raw[raw.length-1].c);
  var chg = fo > 0 ? (lc - fo)/fo*100 : 0;
  $("klineSub").textContent = "现价 $" + lc.toFixed(2) + " · 30 天 " + (chg>=0?"+":"") + chg.toFixed(2) + "%";
  $("klineInfo").textContent = cc ? cc.full + " · Gate 永续合约日 K · 30 天" : "";
  var option = {
    backgroundColor: "transparent",
    animation: true, animationDuration: 700, animationDurationUpdate: 500,
    animationEasing: "cubicOut", animationEasingUpdate: "linear",
    tooltip: { trigger:"axis", triggerOn:"mousemove", renderMode:"richText", confine:true,
      backgroundColor: tv.tooltipBg, borderColor: tv.tooltipBorder, textStyle:{ color: tv.text, fontSize:12 },
      axisPointer: { type:"line", lineStyle:{ color: tv.pointer, type:"dashed", width:1 } },
      formatter: function(params){
        if(!params || !params.length) return "";
        var p = params[0];
        var o = p.data[1], c = p.data[2], l = p.data[3], h = p.data[4];
        return p.axisValue + "<br>开 " + o.toFixed(2) + "　高 " + h.toFixed(2) + "<br>低 " + l.toFixed(2) + "　收 " + c.toFixed(2);
      } },
    grid: [
      { left:58, right:16, top:18, height:"58%" },
      { left:58, right:16, top:"76%", height:"14%" }
    ],
    xAxis: [
      { type:"category", data:dates, gridIndex:0, boundaryGap:true,
        axisLine:{lineStyle:{color: tv.axisLine}}, axisLabel:{ show:false } },
      { type:"category", data:dates, gridIndex:1, boundaryGap:true,
        axisLine:{lineStyle:{color: tv.axisLine}}, axisLabel:{ color: tv.sub, fontSize:10, hideOverlap:true } }
    ],
    yAxis: [
      { gridIndex:0, scale:true, splitLine:{lineStyle:{color: tv.gridLine}}, axisLabel:{ color: tv.sub, fontSize:10 } },
      { gridIndex:1, splitLine:{show:false}, axisLabel:{ show:false } }
    ],
    dataZoom: [
      { type:"inside", xAxisIndex:[0,1], start:0, end:100 },
      { type:"slider", xAxisIndex:[0,1], bottom:0, height:16,
        borderColor: tv.axisLine, backgroundColor: tv.tooltipBg,
        fillerColor: tv.primaryBg, handleStyle:{ color: tv.primary },
        textStyle:{ color: tv.sub, fontSize:10 }, dataBackground:{ lineStyle:{color: tv.axisLine}, areaStyle:{color: tv.primaryBg} } }
    ],
    series: [
      { name:"K线", type:"candlestick", data:ohlc, xAxisIndex:0, yAxisIndex:0,
        itemStyle:{ color: tv.green, color0: tv.red, borderColor: tv.green, borderColor0: tv.red } },
      { name:"成交量", type:"bar", data:vols, xAxisIndex:1, yAxisIndex:1,
        itemStyle:{ color: tv.volBar }, barWidth:"60%" }
    ]
  };
  klineChart.setOption(option, true);
}
function showKlineView(){
  $("viewDash").classList.add("hidden");
  $("viewKline").classList.remove("hidden");
  if(klineCache[activeCoin]) renderKline();
  else loadKline(activeCoin, function(){ renderKline(); });
  if(klineChart) setTimeout(function(){ klineChart.resize(); }, 50);
}
function route(){
  if(location.hash === "#kline") showKlineView();
  else {
    $("viewKline").classList.add("hidden");
    $("viewDash").classList.remove("hidden");
  }
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", function(){ if(chart) chart.resize(); if(priceChart) priceChart.resize(); if(klineChart) klineChart.resize(); });

/* ---------- 表格 ---------- */
var activeTab = "online";
function renderTable(tab){
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-t")===tab); });
  var tb = $("workerTbody");
  tb.classList.add("switching");
  setTimeout(function(){ tb.classList.remove("switching"); }, 120);
  var tb = $("workerTbody"), html = "", th = $("workerTable").querySelector("thead");
  var head = '<tr><th>矿机</th><th>当前算力</th><th>1小时算力</th><th>24小时算力</th><th>最后更新</th></tr>';
  if(tab === "online"){
    html = head;
    S.online.forEach(function(w){
      html += '<tr><td><b>' + esc(w.name) + '</b></td><td>' + fmtHash(w.hash2) + '</td><td>' + (w.hash1h!=null?fmtHash(w.hash1h):"—") + '</td><td>' + (w.hash24h!=null?fmtHash(w.hash24h):"—") + '</td><td>' + relTime(Date.now()/1000 - w.lts) + '</td></tr>';
    });
    if(!S.online.length) html += '<tr><td colspan="5" class="empty">暂无在线矿机</td></tr>';
  } else if(tab === "offline"){
    html = head;
    S.offline.forEach(function(w){
      html += '<tr><td><b>' + esc(w.name) + '</b></td><td>' + fmtHash(w.hash2) + '</td><td>—</td><td>' + (w.hash24h!=null?fmtHash(w.hash24h):"—") + '</td><td class="offline-mark">' + relTime(Date.now()/1000 - w.lts) + ' 离线</td></tr>';
    });
    if(!S.offline.length) html += '<tr><td colspan="5" class="empty">暂无离线矿机</td></tr>';
  } else {
    html = '<tr><th>时间</th><th>金额 (XMR)</th><th>交易哈希</th><th>Mixin</th></tr>';
    S.payments.forEach(function(p){
      var hash = p.txnHash || "";
      html += '<tr><td>' + relTime(Date.now()/1000 - p.ts) + '</td><td>' + (p.amount/1e12).toFixed(8) + '</td><td><a href="' + xmrLink(hash) + '" target="_blank" rel="noreferrer">' + esc(hash.slice(0,10)) + '…' + esc(hash.slice(-8)) + '</a></td><td>' + (p.mixin!=null?p.mixin:"—") + '</td></tr>';
    });
    if(!S.payments.length) html += '<tr><td colspan="4" class="empty">暂无转账记录（达到起付额度后自动支付）</td></tr>';
  }
  tb.innerHTML = html;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---------- 初始化 ---------- */
function init(){
  $("demoTag").textContent = isDemo ? " 演示模式" : "";
  if(isDemo){ $("demoTag").classList.remove("hidden"); }
  var saved = localStorage.getItem("skypool_addr");
  $("addr").value = saved || DEFAULT_ADDR;

  $("btnLoad").addEventListener("click", function(){ startAuto(); loadAll(); });
  $("btnRefresh").addEventListener("click", function(){ loadAll(); });
  $("addr").addEventListener("keydown", function(e){ if(e.key==="Enter"){ startAuto(); loadAll(); } });
  $("announceClose").addEventListener("click", function(){ $("announce").classList.add("hidden"); });
  document.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){ renderTable(b.getAttribute("data-t")); });
  });
  $("autoSel").addEventListener("change", function(){ startAuto(); });

  /* 系统深浅色变化 → 重渲染图表（HTML/CSS 自动跟随） */
  if(window.matchMedia){
    var mq = window.matchMedia("(prefers-color-scheme: light)");
    function onTheme(){ renderAll(); }
    if(mq.addEventListener) mq.addEventListener("change", onTheme);
    else if(mq.addListener) mq.addListener(onTheme);
  }

  /* K 线页：币种 tab + 入口/返回 + 路由 */
  var kt = $("coinTabs");
  KLINE_COINS.forEach(function(x){
    var b = document.createElement("button");
    b.className = "ctab" + (x.c === activeCoin ? " active" : "");
    b.textContent = x.n;
    b.setAttribute("data-c", x.c);
    b.addEventListener("click", function(){
      activeCoin = x.c;
      document.querySelectorAll(".ctab").forEach(function(q){ q.classList.toggle("active", q.getAttribute("data-c")===x.c); });
      if(klineCache[activeCoin]) renderKline();
      else loadKline(activeCoin, function(){ renderKline(); });
    });
    kt.appendChild(b);
  });
  $("btnKline").addEventListener("click", function(){ location.hash = "kline"; });
  $("btnBack").addEventListener("click", function(){ location.hash = ""; });
  route();

  startAuto();
  if(isDemo) loadDemo(); else loadAll();
}
function startAuto(){
  if(timer){ clearInterval(timer); timer = null; }
  var ms = Number($("autoSel").value);
  if(ms){
    timer = setInterval(function(){ if(!isDemo) loadAll(); }, ms);
    $("autoTag").textContent = "每 " + (ms/1000) + " 秒自动刷新";
  } else {
    $("autoTag").textContent = "自动刷新已关闭";
  }
}
/* 时钟 */
setInterval(function(){
  $("clock").textContent = new Date().toLocaleString("zh-CN", { hour12:false });
}, 1000);

document.addEventListener("DOMContentLoaded", init);
